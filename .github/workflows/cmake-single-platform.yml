# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake Build and Unit Test

on:
  push:
    branches: [ "cicd" , "dev" , "master" ]
  pull_request:
    branches: [ "cicd" , "dev" , "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    strategy:
        matrix:
            os: [windows-latest, macos-latest]
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -S ${{github.workspace}}/Team05/Code05/ -B ${{github.workspace}}/Team05/Code05/cmake-cli -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build(AutoTester)
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/Team05/Code05/cmake-cli --target autotester --config ${{env.BUILD_TYPE}}

    - name: Build(Unit Testing)
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/Team05/Code05/cmake-cli --target unit_testing --config ${{env.BUILD_TYPE}}

    - name: Upload Artifact (Unit Testing)
      uses: actions/upload-artifact@v2
      with:
          name: unit_testing_${{matrix.os}}.exe
          path: ${{github.workspace}}/Team05/Code05/cmake-cli/src/unit_testing/Debug/unit_testing_${{matrix.os}}.exe

    - name: Upload Artifact (AutoTester)
      uses: actions/upload-artifact@v2
      with:
          name: autotester_${{matrix.os}}.exe
          path: ${{github.workspace}}/Team05/Code05/cmake-cli/src/autotester/Debug/autotester_${{matrix.os}}.exe

  test:
    needs: build
    runs-on: windows-latest

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v2
      with:
        name: unit_testing_windows-latest.exe
        path: ${{github.workspace}}/Team05/Code05/cmake-cli/src/unit_testing/Debug
        
    - name: Unit Test
      # runs unit test
      run: ${{github.workspace}}/Team05/Code05/cmake-cli/src/unit_testing/Debug/unit_testing.exe
